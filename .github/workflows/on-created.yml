name: On Created
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: on-created-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  on-created:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.is_template == false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate task templates
        run: node .github/scripts/create-task-issues.cjs
      - name: Create common task issues and dependencies
        uses: actions/github-script@v7
        with:
          script: |
            const { createTaskIssues } = require('./.github/scripts/create-task-issues.cjs');
            core.info(await createTaskIssues({ github, context }));
      - name: Initialize README and remove setup files
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sed -i "1s/^# isucon-boilerplate$/# ${GITHUB_REPOSITORY#*/}/" README.md
          sed -i 's!\$GITHUB_REPOSITORY!'"$GITHUB_REPOSITORY"'!g' README.md
          sed -i 's/^- \[ \] Create a new repository/- [x] Create a new repository/' README.md
          git rm -- ':(glob)tasks/*.md' ':(exclude)tasks/README.md' .github/scripts/create-task-issues.cjs .github/workflows/on-created.yml
          git add README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'README を初期化し Issue 化済みのタスクと初期化処理を削除する'
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
